[package]
name = "caudal-tls"
description = "HTTPS (HTTP/1.1 + HTTP/2) for Caudal, with file or ACME certificates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = "1"
axum.workspace = true
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots"] }
rustls-pki-types = "1"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tracing.workspace = true

[dev-dependencies]
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }

[package]
name = "caudal-rtmp"
description = "RTMP and Enhanced RTMP ingest for Caudal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
caudal-scte35.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
parking_lot.workspace = true
byteorder = "1"
scuffle-rtmp = "0.2.3"
scuffle-flv = "0.2.2"
scuffle-amf0 = "0.2.2"
scuffle-h264 = "0.2.2"
scuffle-h265 = "0.2.2"
scuffle-av1 = "0.1.4"
scuffle-aac = "0.1.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
caudal-tls.workspace = true
rcgen = "0.13"
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "process"] }

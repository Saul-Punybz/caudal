name: probe (temporary)
on:
  push:
    branches: [feat/live-captions]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          nproc; grep "model name" /proc/cpuinfo | head -1
      - run: cargo test -p caudal-captions --test pipeline --no-run
      - name: run 1 (full probe log, frames elided)
        run: |
          cargo test -p caudal-captions --test pipeline -- --nocapture 2>&1 | grep -v -e "frame forwarded" -e "frame pts" -e "audio: aac" | tee probe1.log
      - name: run 2 (decode cost split)
        run: |
          cargo test -p caudal-captions --test pipeline -- --nocapture 2>&1 | grep -e "audio: aac" | head -40

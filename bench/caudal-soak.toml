# Caudal config for bench/soak.py (.github/workflows/soak.yml). Loopback
# only (no [admin] needed). Same LL-HLS timings as bench/caudal.toml.
# `[record]` is on for the whole run: recording is part of the workload
# being soaked (segment rotation has its own fds and buffers to leak), and
# `record` is a `requires_restart` section (see crates/caudal/src/
# subsystems.rs), so it cannot be toggled live by the soak's one config
# reload — it has to be decided at start.
[server]
http_bind = "127.0.0.1:8080"

[rtmp]
bind = "127.0.0.1:1935"
app = "live"

[srt]
bind = "127.0.0.1:9000"

[hls]
part_ms = 200
segment_ms = 2000

[buffer]
window_secs = 50
max_mb = 256

[rtsp]
bind = "127.0.0.1:8554"

[webrtc]
udp_bind = "127.0.0.1:8189"

# MoQ is on by default (as in MediaMTX); loopback like everything else.
[moq]
bind = "127.0.0.1:4443"

[record]
enabled = true
dir = "recordings"
streams = ["*"]
segment_secs = 4

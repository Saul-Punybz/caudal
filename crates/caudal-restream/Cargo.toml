[package]
name = "caudal-restream"
description = "RTMP/RTMPS push (multistreaming) for Caudal: forwards a live stream to YouTube, Twitch, Facebook or any RTMP ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
parking_lot.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
rml_rtmp = "0.8.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
caudal-rtmp.workspace = true
tower = { version = "0.5", features = ["util"] }

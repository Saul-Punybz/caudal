# ARM hardware crypto for SRTP (WebRTC). On aarch64, `aes` 0.8 and
# `polyval` 0.6 (AES-GCM) only use the ARMv8 AES/PMULL instructions when
# built with these cfgs; without them every SRTP packet is encrypted in
# software. Profiling 19 Sep 2026 (300 WHEP viewers, Apple M4): the WebRTC
# thread spent its time in `aes::soft::fixslice` and `polyval::soft`.
# Both crates still detect the CPU at run time (Linux, macOS), so ARM
# chips without the crypto extensions fall back to software. x86_64 needs
# nothing: AES-NI/PCLMULQDQ are detected automatically.
# Note: a RUSTFLAGS environment variable replaces these flags.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"  # scte35-splice (caudal-scte35) requires 1.95
license = "MIT OR Apache-2.0"
repository = "https://github.com/Saul-Punybz/caudal"

[workspace.dependencies]
# Signals to process groups (`kill -KILL -<pgid>` via /bin/kill kills every
# process of the user on Linux procps; see caudal-transcode ffmpeg.rs).
rustix = { version = "1", features = ["process"] }
arc-swap = "1"
bytes = "1"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caudal-core = { path = "crates/caudal-core", version = "0.1.0" }
caudal-rtmp = { path = "crates/caudal-rtmp", version = "0.1.0" }
caudal-hls = { path = "crates/caudal-hls", version = "0.1.0" }
caudal-srt = { path = "crates/caudal-srt", version = "0.1.0" }
caudal-ui = { path = "crates/caudal-ui", version = "0.1.0" }
caudal-tls = { path = "crates/caudal-tls", version = "0.1.0" }
caudal-auth = { path = "crates/caudal-auth", version = "0.1.0" }
caudal-webrtc = { path = "crates/caudal-webrtc", version = "0.1.0" }
caudal-moq = { path = "crates/caudal-moq", version = "0.1.0" }
caudal-cmaf = { path = "crates/caudal-cmaf", version = "0.1.0" }
caudal-record = { path = "crates/caudal-record", version = "0.1.0" }
caudal-ts = { path = "crates/caudal-ts", version = "0.1.0" }
caudal-rtsp = { path = "crates/caudal-rtsp", version = "0.1.0" }
caudal-transcode = { path = "crates/caudal-transcode", version = "0.1.0" }
caudal-channel = { path = "crates/caudal-channel", version = "0.1.0" }
caudal-restream = { path = "crates/caudal-restream", version = "0.1.0" }
caudal-scte35 = { path = "crates/caudal-scte35", version = "0.1.0" }
caudal-admin = { path = "crates/caudal-admin", version = "0.1.0" }
caudal-health = { path = "crates/caudal-health", version = "0.1.0" }

# argon2 unoptimized takes seconds per hash, which makes debug tests crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The in-process H.264 engine encodes in real time; unoptimized it could not
# keep up on a 4-core CI runner even alone (112 of 240 frames).
[profile.dev.package.rusty_h264]
opt-level = 3
[profile.dev.package.rusty_h264-common]
opt-level = 3
[profile.dev.package.rusty_h264-encoder]
opt-level = 3
[profile.dev.package.rusty_h264-decoder]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Never "abort": with unwind, tokio contains a panic to the task that hit it
# (one connection or one stream), instead of killing every stream on the
# server. Debug builds, where all tests run, always unwind, so abort was a
# production-only failure mode no test could see. Guarded by
# crates/caudal/tests/release_profile.rs.
panic = "unwind"

# scuffle-rtmp 0.2.3 (latest) froze timestamps on Type 3 chunks that start a
# new message. Patched copy with a regression test; see vendor/README.md.
[patch.crates-io]
scuffle-rtmp = { path = "vendor/scuffle-rtmp" }

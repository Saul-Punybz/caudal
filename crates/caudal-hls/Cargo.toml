[package]
name = "caudal-hls"
description = "LL-HLS / CMAF, classic TS-segment HLS and continuous HTTP MPEG-TS output for Caudal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
caudal-cmaf.workspace = true
caudal-scte35.workspace = true
caudal-ts.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
mp4-atom = "0.15.0"
bytes.workspace = true
# `Body::from_stream` over the HTTP-TS output's bounded channel.
tokio-stream = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "3", default-features = false }
# tests/http_ts.rs: Caudal pulling its own HTTP-TS output.
caudal-http-pull.workspace = true

[[example]]
name = "demo"

[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

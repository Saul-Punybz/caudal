<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caudal · live</title>
<style>
  :root { color-scheme: dark; --fg: #e8e8ea; --dim: #8a8a93; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 12px; }
  video { width: 100%; height: 100%; max-height: calc(100vh - 64px); background: #000; border-radius: 6px; object-fit: contain; }
  footer { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 10px 16px 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom)); border-top: 1px solid #1c1c21; }
  .name { font-weight: 600; }
  .stat { color: var(--dim); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--fg); font-weight: 600; }
  #latency.ok { color: var(--ok); } #latency.warn { color: var(--warn); } #latency.bad { color: var(--bad); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .live .dot { background: var(--bad); }
</style>
</head>
<body>
<main><video id="v" controls autoplay muted playsinline></video></main>
<footer>
  <span class="name" id="state"><span class="dot"></span><span id="name"></span></span>
  <span class="stat">latency <b id="latency">–</b></span>
  <span class="stat">buffer <b id="buffer">–</b></span>
  <span class="stat" id="engine"></span>
</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
(function () {
  "use strict";
  var name = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  var token = new URLSearchParams(location.search).get("token");
  var src = "/hls/" + encodeURIComponent(name) + "/master.m3u8" + (token ? "?token=" + encodeURIComponent(token) : "");
  var video = document.getElementById("v");
  // The muted attribute alone did not always reach the property in WebKit
  // (browser suite, 19 Sep 2026); muted is what lets autoplay start.
  video.muted = true;

  // Firefox acts on the `autoplay` attribute only once the element reaches
  // HAVE_ENOUGH_DATA; on a live stream that was 3-6 s after the first frames
  // were buffered (browser suite, 21 Sep 2026). The playhead stays where hls.js
  // put it while the live edge runs away, so the viewer joins that far behind.
  // Chromium and Safari start at HAVE_FUTURE_DATA; ask for the same.
  function tryPlay() {
    if (video.paused && !holding) video.play().catch(function () {});
  }
  video.addEventListener("loadeddata", tryPlay);
  video.addEventListener("canplay", tryPlay);
  var $ = function (id) { return document.getElementById(id); };
  $("name").textContent = name;
  document.title = name + " · Caudal";

  var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
  var useNative = isSafari && video.canPlayType("application/vnd.apple.mpegurl");
  var hls = null;

  function startHlsJs() {
    $("engine").textContent = "hls.js " + Hls.version;
    // maxLiveSyncPlaybackRate: when a player starts or drifts behind the live
    // target, hls.js plays up to 1.5x until it catches up (measured 18 Sep:
    // Firefox sat at 3.1 s and Chromium at 2.4 s without it).
    // No liveSyncDuration/liveSyncDurationCount: either one overrides the
    // low-latency target (PART-HOLD-BACK, 0.6 s) with N x segment length.
    // liveSyncDurationCount: 1 pinned every hls.js player at 2 s (18 Sep).
    // liveDurationInfinity: without it hls.js sets the MediaSource duration
    // to the playlist's length, so when a publisher drops and the playlist
    // stops growing (the reconnect grace), playback reaches that duration
    // and WebKit reports `ended` although the stream is still live.
    hls = new Hls({
      lowLatencyMode: true,
      backBufferLength: 30,
      maxLiveSyncPlaybackRate: 1.5,
      liveDurationInfinity: true,
    });
    hls.on(Hls.Events.ERROR, function (_e, data) {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      hls.destroy();
      setTimeout(startHlsJs, 2000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  function startNative() {
    $("engine").textContent = "native HLS";
    video.addEventListener("error", function () {
      setTimeout(function () { video.src = src + "?t=" + Date.now(); video.play().catch(function () {}); }, 2000);
    });
    video.src = src;
  }

  // Glass-to-glass minus the encoder: now minus the wall clock stamped on
  // the frame on screen (EXT-X-PROGRAM-DATE-TIME), else hls.js' estimate.
  function latency() {
    if (hls) {
      if (hls.playingDate) return (Date.now() - hls.playingDate.getTime()) / 1000;
      if (isFinite(hls.latency)) return hls.latency;
      return NaN;
    }
    if (video.getStartDate) {
      var start = video.getStartDate().getTime();
      if (!isNaN(start)) return (Date.now() - (start + video.currentTime * 1000)) / 1000;
    }
    return NaN;
  }

  // hls.js speeds up towards the live edge only while the playhead is within
  // one target duration of the target latency; further back it reads as DVR
  // playback and is left alone, and the seek-back is off by default
  // (liveMaxLatencyDurationCount = Infinity). A player that joined late — a
  // slow first load, a tab that was not allowed to autoplay — would otherwise
  // stay seconds behind live for the rest of the session. Jump it forward
  // once it has been stranded there for two seconds.
  var strandedTicks = 0;
  function keepUpWithLive() {
    var details = hls && hls.latestLevelDetails;
    var target = hls && hls.targetLatency;
    if (!details || !details.live || target === null || video.paused || video.seeking || !isFinite(hls.latency)) {
      strandedTicks = 0;
      return;
    }
    if (hls.latency - target <= target + details.targetduration) {
      strandedTicks = 0;
      return;
    }
    if (++strandedTicks < 8) return;
    strandedTicks = 0;
    var pos = hls.liveSyncPosition;
    if (pos !== null && isFinite(pos) && pos > video.currentTime) video.currentTime = pos;
  }

  // When a publisher drops and comes back within the reconnect grace, the
  // buffer runs dry at the edge of a playlist that stopped advancing, and
  // the element resumes on the first part of the new publish: hls.js has no
  // rebuffer goal, and its latency controller only ever speeds up
  // (maxLiveSyncPlaybackRate), never backs off. Playback then stays one
  // part behind the encoder with no headroom. Chromium and Firefox cope;
  // WebKit (GStreamer MSE on Linux) on a loaded 2-core CI runner did not:
  // it advanced 0.50 s in 3 s after the seam (browser suite, 21 Nov 2026).
  // So a stall on a playlist that has not advanced for STALE_S is held
  // (paused) until the playlist's edge is the goal ahead of the playhead.
  // A stall while parts keep coming (a slow fetch, a startup hiccup) is
  // left to hls.js: holding there only added latency (Chromium lost a
  // second of play.spec's 3 s window). The distance is to the playlist's
  // edge, not hls.latency, which keeps growing with the playlist's age
  // while a publisher is away. The goal is hls.targetLatency, at least
  // HOLD_MIN_S (hls.js reports no stall of its own while the element is
  // paused, so it does not raise the target) and at most HOLD_CAP_S, so the
  // latency stays under 3 s. HOLD_MAX_MS releases a stream that ended, and
  // holes up to 0.5 s count as buffer (hls.js' gap controller jumps them).
  var holding = false, holdSince = 0, played = false;
  var HOLD_MIN_S = 1, HOLD_CAP_S = 2, HOLD_MAX_MS = 8000, STALE_S = 1;
  video.addEventListener("playing", function () { played = true; });
  function bufferAhead() {
    var b = video.buffered, t = video.currentTime;
    for (var i = 0; i < b.length; i++) if (b.start(i) <= t + 0.5 && t < b.end(i)) return b.end(i) - t;
    return 0;
  }
  function rebufferToTarget() {
    var details = hls && hls.latestLevelDetails;
    var live = !!(details && details.live && isFinite(details.edge));
    var goal = Math.min(Math.max((hls && hls.targetLatency) || 0, HOLD_MIN_S), HOLD_CAP_S);
    var edgeAhead = live ? details.edge - video.currentTime : 0;
    if (holding && !video.paused) holding = false; // the viewer pressed play
    if (holding) {
      if (!live || (edgeAhead >= goal && bufferAhead() > 0.3) || Date.now() - holdSince > HOLD_MAX_MS) {
        holding = false;
        video.play().catch(function () {});
      }
      return;
    }
    if (!live || !played || video.paused || video.seeking || video.ended) return;
    if (video.readyState >= 3 || bufferAhead() > 0.1 || edgeAhead >= goal || !(details.age > STALE_S)) return;
    holding = true;
    holdSince = Date.now();
    video.pause();
  }
  video.addEventListener("waiting", rebufferToTarget);

  setInterval(function () {
    rebufferToTarget();
    keepUpWithLive();
    var l = latency();
    var el = $("latency");
    if (isFinite(l) && !video.paused) {
      el.textContent = l.toFixed(2) + " s";
      el.className = l < 3 ? "ok" : l < 6 ? "warn" : "bad";
      $("state").className = "name live";
    } else {
      el.textContent = "–";
      el.className = "";
      $("state").className = "name";
    }
    var b = video.buffered;
    $("buffer").textContent = b.length ? (b.end(b.length - 1) - video.currentTime).toFixed(2) + " s" : "–";
  }, 250);

  if (useNative || typeof Hls === "undefined" || !Hls.isSupported()) startNative(); else startHlsJs();
})();
</script>
</body>
</html>

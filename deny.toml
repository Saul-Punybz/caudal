# cargo-deny v2 configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# RustSec vulnerabilities fail the build; unmaintained crates are reported
# for workspace dependencies only.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
# Copyleft (GPL, AGPL, LGPL, MPL) is excluded by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

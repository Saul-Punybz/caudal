name: Benchmark (Linux)

# Heavy benchmarks run here, on GitHub's Linux runners, instead of on a
# developer laptop (19 Sep 2026: the M4 overheated running them next to
# builds). Shared runners are noisy: compare Caudal and MediaMTX within the
# same run, not absolute numbers across runs.
on:
  workflow_dispatch:
    inputs:
      protos:
        description: "Protocols (hls,rtsp,whep)"
        default: "whep"
      levels:
        description: "Viewer levels"
        default: "100,300"
      reps:
        description: "Repetitions per cell"
        default: "3"
      only:
        description: "Scenarios (idle,fanout,latency)"
        default: "fanout"
      servers:
        description: "Servers"
        default: "caudal,mediamtx"
      profile:
        description: "perf-record these fan-out cells, first rep only (e.g. rtsp:300); empty = off"
        default: ""
      heap:
        description: "dhat heap profile with one publisher for this many seconds instead of the benchmark (bench/heap.sh); empty = off"
        default: ""
      settle:
        description: "Seconds a publisher runs before the publish RSS window (10 = the M4 report; 60 = a full 50 s buffer)"
        default: "10"
      omt:
        description: "OMT CPU scenarios instead of the benchmark (bench/omt.py): ingest,output; empty = off"
        default: ""

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/client
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          nproc; free -g; uname -a
      - name: Profiler
        if: inputs.profile != ''
        run: |
          sudo apt-get install -y "linux-tools-$(uname -r)" linux-tools-common \
            || sudo apt-get install -y linux-tools-azure linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version
          cargo install inferno --locked --quiet
          # Symbols for the profile; codegen is unchanged (same opt-level, LTO).
          echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_STRIP=none" >> "$GITHUB_ENV"
          echo "BENCH_PROFILE=${{ inputs.profile }}" >> "$GITHUB_ENV"
      # OMT (M12): omt send -> [[omt.pull]] -> ffmpeg, and an H.264 stream
      # -> [[omt.output]] -> omt recv, at 1080p60. The same ffmpeg 8 the CI
      # tests use (the feed's Matroska raw-video input is untested on
      # Ubuntu's ffmpeg 6), and the `omt` tool at the rev Caudal pins.
      - name: OMT scenarios
        if: inputs.omt != ''
        run: |
          set -o pipefail
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt
          export PATH="/opt/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin:$PATH"
          ffmpeg -hide_banner -version | head -1
          rev=$(sed -n 's/^open-media-transport = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
          cargo install --locked --git https://github.com/Saul-Punybz/open-media-transport --rev "$rev" omt-cli --root "$HOME/.omt"
          cargo build --release -p caudal
          OMT_CLI="$HOME/.omt/bin/omt" python3 bench/omt.py --only "${{ inputs.omt }}" | tee bench-out.md
          cat bench-out.md >> "$GITHUB_STEP_SUMMARY"
      - name: Heap profile
        if: inputs.heap != '' && inputs.omt == ''
        run: |
          bench/heap.sh "${{ inputs.heap }}"
          { echo '```'; cat bench/results/dhat-top.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run
        if: inputs.heap == '' && inputs.omt == ''
        env:
          BENCH_SETTLE_S: ${{ inputs.settle }}
        run: |
          set -o pipefail   # `| tee` must not hide a failed run
          ulimit -n 65536 || true
          bench/run.sh --reps "${{ inputs.reps }}" --only "${{ inputs.only }}" \
            --protos "${{ inputs.protos }}" --levels "${{ inputs.levels }}" \
            --servers "${{ inputs.servers }}" | tee bench-out.md
          cat bench-out.md >> "$GITHUB_STEP_SUMMARY"
      - name: Profile reports
        if: always() && inputs.profile != ''
        run: |
          shopt -s nullglob
          for d in bench/results/perf-*.data; do
            b="${d%.data}"
            perf report -i "$d" --stdio --no-children --percent-limit 0.5 > "$b.txt" 2>/dev/null || true
            perf report -i "$d" --stdio --children --no-call-graph --percent-limit 1 > "$b.children.txt" 2>/dev/null || true
            perf script -i "$d" 2>/dev/null | inferno-collapse-perf > "$b.folded" || true
            inferno-flamegraph < "$b.folded" > "$b.svg" || true
            { echo "### $(basename "$b") (self, top 25)"; echo '```';
              grep -E '^ +[0-9]' "$b.txt" | head -25; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            rm -f "$d"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench/results/
            bench-out.md

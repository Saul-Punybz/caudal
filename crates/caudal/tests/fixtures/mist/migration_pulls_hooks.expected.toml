# Generated by `caudal import-mist` from a MistServer config. Validated against
# Caudal's own rules already (same checks as `caudal check`); read the import
# report printed alongside this file for what was approximated or dropped.
# `caudal doctor --config <this file>` checks the setup it describes next.

[server]
http_bind = "127.0.0.1:8080"

[rtmp]
bind = "0.0.0.0:1935"
app = "live"

[srt]
bind = "0.0.0.0:8889"

[[srt.pull]]
stream = "venue"
url = "srt://203.0.113.7:9000?streamid=play/main&latency=200"

[buffer]
window_secs = 60

[[hls.pull]]
stream = "news"
url = "https://cdn.example.com/live/news/index.m3u8"

[[udp.pull]]
stream = "catv"
url = "udp://239.1.1.1:5000"

[[push.auto]]
streams = ["studio"]
url = "rtmp://a.rtmp.youtube.com/live2/xxxx-xxxx-xxxx-xxxx"

# Scheduled in MistServer: uncomment once this Caudal has `[[push.auto]]`
# `start`/`stop` (PR #57). Active without them it would push all the time.
# [[push.auto]]
# streams = ["venue"]
# url = "srt://198.51.100.20:9000?streamid=publish/venue"
# start = "2026-12-24T22:00:00Z"
# stop = "2026-12-25T01:00:00Z"

[record]
enabled = true
dir = "/var/lib/mist/rec"
streams = []

[[record.schedule]]
streams = ["studio"]
start = "2026-12-24T22:00:00Z"
duration_secs = 10800

# From MistServer's blocking triggers. Caudal reads the status code, not the
# body: 2xx allows, 401/403 denies. Port the handler before going live (a
# MistServer handler answering 200 `false` would allow). docs/AUTH-HOOK.md
[auth.hook]
url = "https://auth.example.com/mist/user_new"
secret = "whsec_GENERATED"
on_error = "deny"
publish = false
play = true

# From MistServer's PUSH_REWRITE / PLAY_REWRITE. The request is signed JSON,
# not text lines; plain-text answers are accepted. docs/REWRITE-HOOK.md
[auth.rewrite]
url = "https://auth.example.com/mist/push_rewrite"
secret = "whsec_GENERATED"
on_error = "deny"
publish = true
play = false

# Admin login: without it, Caudal refuses to listen on anything but loopback.
# Hash each MistServer user's new password: printf '%s\n' 'pass' | caudal hash-password
# [admin]
# session_ttl_secs = 43200
# [[admin.users]]
# name = "ana"
# password_hash = "$argon2id$..."

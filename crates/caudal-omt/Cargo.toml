[package]
name = "caudal-omt"
description = "Open Media Transport ingest and output for Caudal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
caudal-core.workspace = true
caudal-transcode.workspace = true
tokio.workspace = true
tracing.workspace = true
# Our own OMT crates (MIT OR Apache-2.0), pinned to a pushed commit while M12 is
# developed; switch to crates.io 0.2.x before tagging (git deps block publishing).
open-media-transport = { git = "https://github.com/Saul-Punybz/open-media-transport", rev = "8c275ff" }
vmx-codec = { git = "https://github.com/Saul-Punybz/open-media-transport", rev = "8c275ff" }

[features]
# TEMPORARY (feat/m12-wiring): placeholder pull/output API so the caudal
# binary's wiring builds before ingest.rs/output.rs land. Delete at merge
# (see src/wiring_stubs.rs).
wiring-stubs = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

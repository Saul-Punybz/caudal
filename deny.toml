# cargo-deny v2 configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
# RustSec vulnerabilities fail the build; unmaintained crates are reported
# for workspace dependencies only.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Marvin attack on the `rsa` crate (pulled in by jsonwebtoken's pure-Rust
    # backend): a timing side channel in RSA *private-key* operations
    # (decrypt/sign). Caudal only verifies JWT signatures with public keys
    # and never holds an RSA private key, so the vulnerable path is never
    # run. The alternative backend (aws-lc-rs) is C and breaks our static
    # musl builds. Revisit when rsa 0.10 ships a constant-time fix.
    # Reviewed 18 Sep 2026.
    { id = "RUSTSEC-2023-0071", reason = "only public-key verification is used; no RSA private-key operations" },
]

[licenses]
version = 2
# Copyleft (GPL, AGPL, LGPL, MPL) is excluded by omission.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # webpki-roots: Mozilla's CA root list, a permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

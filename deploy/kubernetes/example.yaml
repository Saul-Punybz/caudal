# Rendered example of deploy/helm/caudal, for reading or for `kubectl
# apply -f` without installing Helm. Generated with:
#
#   helm template caudal deploy/helm/caudal \
#     --namespace caudal \
#     --set image.tag=0.1.0 \
#     --set admin.passwordHash='<output of `caudal hash-password`>' \
#     --set webrtc.publicIps='{203.0.113.9}' \
#     --set persistence.enabled=true --set persistence.size=50Gi \
#     --set record.enabled=true
#
# Two placeholders below MUST be replaced before this is usable:
#   - admin.passwordHash (the Secret's stringData): generate your own with
#     `printf '%s\n' '<password>' | caudal hash-password`.
#   - webrtc.publicIps (baked into the ConfigMap's caudal.toml): this
#     server's real, internet-reachable IP — see the chart's README
#     ("Networking") for why WebRTC needs this to be correct.
#
# This file is a snapshot for reference; the chart in deploy/helm/caudal/
# is what to actually install and upgrade (`helm install`/`helm upgrade`),
# since re-rendering by hand after every values change is easy to forget.

---
# Source: caudal/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: caudal
  labels:
    helm.sh/chart: caudal-0.1.0
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: caudal/templates/secret-admin.yaml
apiVersion: v1
kind: Secret
metadata:
  name: caudal-admin
  labels:
    helm.sh/chart: caudal-0.1.0
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  password-hash: "$argon2id$v=19$m=19456,t=2,p=1$REPLACE_ME_WITH_YOUR_OWN_HASH$REPLACE_ME_REPLACE_ME_REPLACE_ME"

---
# Source: caudal/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: caudal
  labels:
    helm.sh/chart: caudal-0.1.0
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Everything except the admin password hash, which is never put in a
  # ConfigMap — see templates/secret-admin.yaml and the initContainer in
  # templates/deployment.yaml that merges the two into one file at
  # startup, since `caudal --config` only takes a single path.
  caudal.toml: |
    [server]
    http_bind = "0.0.0.0:8080"

    [rtmp]
    bind = "0.0.0.0:1935"
    app = "live"

    [hls]
    part_ms = 200
    segment_ms = 2000

    [buffer]
    window_secs = 50
    max_mb = 256

    [webrtc]
    udp_bind = "0.0.0.0:8189"
    threads = 0
    public_ips = ["203.0.113.9"]

    [srt]
    bind = "0.0.0.0:9000"
    latency_ms = 120

    [moq]
    enabled = true
    bind = "0.0.0.0:4443"

    [record]
    enabled = true
    dir = "/data/recordings"
    streams = ["*"]
    segment_secs = 4

    [admin]
    session_ttl_secs = 43200
    public_metrics = false
    secure_cookies = false
    allow_unauthenticated = false
    # [[admin.users]] is appended at container start from the Secret named
    # by templates/_helpers.tpl's "caudal.adminSecretName" — see the
    # `merge-config` initContainer in templates/deployment.yaml.


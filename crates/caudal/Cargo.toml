[package]
name = "caudal"
description = "Caudal media server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["captions"]
# Live captions (`[captions]`, `caudal captions fetch-model`). Without it the
# binary has no speech-to-text engine (no candle); a config that sets
# `[captions]` is rejected at `caudal check` and startup.
captions = ["dep:caudal-captions"]
# Heap profiling with dhat (bench/heap.sh, on the Linux bench runner): every
# allocation is recorded with its backtrace, and `dhat-heap.json` is written
# when the server exits. Slow; never for production builds.
dhat-heap = ["dep:dhat"]

[dependencies]
caudal-core.workspace = true
caudal-rtmp.workspace = true
caudal-hls.workspace = true
caudal-srt.workspace = true
caudal-ui.workspace = true
caudal-tls.workspace = true
caudal-auth.workspace = true
caudal-webrtc.workspace = true
caudal-moq.workspace = true
caudal-record.workspace = true
caudal-rtsp.workspace = true
caudal-channel.workspace = true
caudal-restream.workspace = true
caudal-transcode.workspace = true
caudal-scte35.workspace = true
caudal-admin.workspace = true
caudal-health.workspace = true
caudal-access.workspace = true
# Live captions (Whisper on candle): the `captions` feature, on by default.
caudal-captions = { workspace = true, optional = true }
# `caudal captions fetch-model` verifies every downloaded file.
sha2 = "=0.10.9"
caudal-cluster.workspace = true
url = "2"
caudal-failover.workspace = true
caudal-multicast.workspace = true
axum.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
toml = "1.1.6"
dhat = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# `caudal doctor`: a blocking HTTP client (own /healthz, a running
# server's /api/v1/streams, and the online clock check) is simpler here
# than pulling the tokio runtime in before we know a subcommand needs it.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Cert/key match validation (`CertifiedKey::from_der`) for `doctor`'s TLS
# check, same crypto provider (`ring`) caudal-tls already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1"
# Certificate expiry and SAN inspection for `doctor`'s TLS check; already
# in the dependency tree via rustls-acme and moq-native.
x509-parser = "0.18"
rustix.workspace = true

[dev-dependencies]
tempfile = "3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rcgen = "0.14"
time = "0.3"
serde_json.workspace = true
tower = { version = "0.5", features = ["util"] }
hex = "=0.4.3"
# Builds a tiny in-memory .mmdb for the [access] geoip_db config test.
maxminddb-writer = "0.1"
# In-process MoQ "encoder" for the ingest e2e test (no publisher CLI ships
# for the pinned moq-net draft, so the test acts as one with the same
# crates caudal-moq itself uses); pinned to the same versions.
moq-net = "=0.2.22"
hang = "=0.20.13"
moq-mux = "=0.9.16"
moq-native = { version = "=0.19.19", default-features = false, features = ["quinn", "ring"] }
bytes.workspace = true
url = "2"
mp4-atom = "0.15.0"

name: Soak (Linux)

# Hours of publish + viewers against Caudal alone, on GitHub's Linux
# runners (never a developer laptop, same reasoning as bench.yml). Proves
# the server holds steady over time: no RSS/fd/thread/CPU growth, no
# dropped streams. See bench/soak.py for the workload and verdict rules.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Run length in minutes (max 330)"
        default: "120"
      churn_minutes:
        description: "Minutes between churn events (publisher restart + a batch of short-lived viewers)"
        default: "15"
      heap:
        description: "Build with the dhat-heap feature and print the allocation sites still holding bytes at exit (slow; use a short, light, churn-heavy run)"
        type: boolean
        default: false
      streams:
        description: "Publishers"
        default: "3"
      viewers:
        description: "Long-lived viewers per stream per protocol"
        default: "10"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  # TEMPORARY, for PR #20 verification only: workflow_dispatch can't run
  # until this file is on the default branch, so this branch also runs on
  # push while the PR is open. PUSH_MINUTES below controls the length.
  # Remove this trigger (and PUSH_MINUTES) before merging.
  push:
    branches: [test/soak]

env:
  PUSH_MINUTES: "30"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/client
      - name: Resolve run length
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MINUTES="$PUSH_MINUTES"   # TEMPORARY, see the `push:` trigger above
          else
            MINUTES="${{ inputs.minutes }}"
            MINUTES="${MINUTES:-120}"
          fi
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 330 ]; then
            echo "minutes must be an integer in 1..330, got '$MINUTES'" >&2
            exit 1
          fi
          echo "MINUTES=$MINUTES" >> "$GITHUB_ENV"
          CHURN="${{ inputs.churn_minutes }}"
          CHURN="${CHURN:-15}"
          if ! [[ "$CHURN" =~ ^[0-9]+$ ]] || [ "$CHURN" -lt 1 ]; then
            echo "churn_minutes must be a positive integer, got '$CHURN'" >&2
            exit 1
          fi
          echo "CHURN_MINUTES=$CHURN" >> "$GITHUB_ENV"
          echo "STREAMS=$(echo "${{ inputs.streams }}" | grep -E '^[0-9]+$' || echo 3)" >> "$GITHUB_ENV"
          echo "VIEWERS=$(echo "${{ inputs.viewers }}" | grep -E '^[0-9]+$' || echo 10)" >> "$GITHUB_ENV"
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3-matplotlib
          nproc; free -g; uname -a
      - name: Build
        run: |
          if [ "${{ inputs.heap }}" = "true" ]; then
            # Symbols for the dhat backtraces; codegen is unchanged.
            export CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none
            cargo build --release -p caudal --features dhat-heap
          else
            cargo build --release -p caudal
          fi
          (cd bench/client && cargo build --release)
      - name: Soak
        run: |
          set -o pipefail
          ulimit -n 65536 || true
          echo "run length: ${MINUTES} minutes, churn every ${CHURN_MINUTES} min"
          csv="$(python3 bench/soak.py run --minutes "$MINUTES" --churn-minutes "$CHURN_MINUTES" \
            --streams "$STREAMS" --viewers "$VIEWERS")"
          echo "SOAK_CSV=$csv" >> "$GITHUB_ENV"
      - name: Verdict
        if: always() && env.SOAK_CSV != ''
        run: |
          set -o pipefail
          python3 bench/soak.py verdict "$SOAK_CSV" | tee soak-summary.md
          status=${PIPESTATUS[0]}
          cat soak-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Heap profile
        if: always() && inputs.heap
        run: |
          # The server runs with bench/.cache as its working directory, so
          # dhat writes the profile there (main.rs, on SIGTERM).
          json=bench/.cache/dhat-heap.json
          if [ ! -f "$json" ]; then echo "no $json (server did not exit cleanly?)"; exit 0; fi
          cp "$json" bench/results/dhat-heap.json
          {
            echo "### Heap still held at exit"; echo '```'
            python3 bench/dhat_top.py "$json" 30 --at-end
            echo '```'; echo "### Heap at peak"; echo '```'
            python3 bench/dhat_top.py "$json" 20
            echo '```'
          } | tee bench/results/dhat-top.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-results
          path: |
            bench/results/soak-*
            bench/results/dhat-*
            soak-summary.md

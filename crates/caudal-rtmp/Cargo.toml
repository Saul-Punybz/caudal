[package]
name = "caudal-rtmp"
description = "RTMP and Enhanced RTMP ingest for Caudal: publishers in, pulls from remote RTMP(S) servers, and the RTMP client pushes use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
caudal-scte35.workspace = true
tokio.workspace = true
tracing.workspace = true
bytes.workspace = true
parking_lot.workspace = true
byteorder = "1"
scuffle-rtmp = "0.2.3"
scuffle-flv = "0.2.2"
scuffle-amf0 = "0.2.2"
scuffle-h264 = "0.2.2"
scuffle-h265 = "0.2.2"
scuffle-av1 = "0.1.4"
scuffle-aac = "0.1.3"
rml_rtmp = "0.8.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"

[dev-dependencies]
caudal-tls.workspace = true
rcgen = "0.13"
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util", "process"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: CAUDAL_E2E=1 cargo test -p caudal --test e2e -- --test-threads=1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  validate-hls:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg
      - name: Is Apple's validator installed?
        id: msv
        run: |
          if command -v mediastreamvalidator >/dev/null; then
            echo "present=1" >> "$GITHUB_OUTPUT"
            echo "mediastreamvalidator: $(command -v mediastreamvalidator)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=LL-HLS conformance NOT VERIFIED::mediastreamvalidator is not installed on this runner (Apple ships it in the HTTP Live Streaming Tools download, behind an Apple ID)."
            echo "### ⚠️ LL-HLS conformance NOT VERIFIED: mediastreamvalidator not installed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: e2e (validator required when present)
        env:
          CAUDAL_E2E: "1"
          CAUDAL_REQUIRE_HLS_VALIDATOR: ${{ steps.msv.outputs.present }}
          CAUDAL_VALIDATION_DIR: ${{ github.workspace }}/hls-validation
        run: cargo test -p caudal --test e2e -- --test-threads=1 --nocapture
      - name: Evidence the validator ran
        if: steps.msv.outputs.present == '1'
        run: |
          ls -l hls-validation
          test -s hls-validation/ll_hls.json
          test -s hls-validation/canary.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.msv.outputs.present == '1'
        with:
          name: hls-validation
          path: hls-validation/

  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release -p caudal --target ${{ matrix.target }}
      - run: ls -lh target/${{ matrix.target }}/release/caudal
      - uses: actions/upload-artifact@v4
        with:
          name: caudal-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/caudal

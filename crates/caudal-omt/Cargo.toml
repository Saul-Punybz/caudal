[package]
name = "caudal-omt"
description = "Open Media Transport ingest and output for Caudal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
caudal-core.workspace = true
caudal-transcode.workspace = true
tokio.workspace = true
tracing.workspace = true
# Our own OMT crates, pinned in the root Cargo.toml.
open-media-transport.workspace = true
vmx-codec.workspace = true

[features]
# TEMPORARY (feat/m12-wiring): placeholder pull/output API so the caudal
# binary's wiring builds before ingest.rs/output.rs land. Delete at merge
# (see src/wiring_stubs.rs).
wiring-stubs = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

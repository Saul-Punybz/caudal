# CI profile: a hung test is terminated and named instead of stalling the
# job for hours (19 Sep 2026: the test step sat at 34 min with no log).
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }
# Print passing tests' output too, so the SKIP gate can see it.
success-output = "immediate"
failure-output = "immediate-final"

# Real-time software encoding in a debug build (caudal-transcode's
# rusty_h264): it keeps up alone but dropped half its frames on a 4-core CI
# runner while other tests ran (115 of 240). It runs with the machine to
# itself instead of loosening the assertion.
[[profile.default.overrides]]
filter = 'package(caudal-transcode) & test(rusty_h264_rendition)'
threads-required = "num-cpus"

[[profile.ci.overrides]]
filter = 'package(caudal-transcode) & test(rusty_h264_rendition)'
threads-required = "num-cpus"

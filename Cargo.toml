[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Saul-Punybz/caudal"

[workspace.dependencies]
bytes = "1"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caudal-core = { path = "crates/caudal-core", version = "0.1.0" }
caudal-rtmp = { path = "crates/caudal-rtmp", version = "0.1.0" }
caudal-hls = { path = "crates/caudal-hls", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

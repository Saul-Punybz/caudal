name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # ffmpeg 8 (Ubuntu's apt has 6, without the WHIP muxer) and libsrt's
      # srt-live-transmit, so the interop tests run instead of printing SKIP.
      - name: Install ffmpeg 8 and srt-tools
        run: |
          sudo apt-get update && sudo apt-get install -y srt-tools
          curl -fsSL -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt
          echo "/opt/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"
      - run: ffmpeg -hide_banner -muxers | grep -i whip && srt-live-transmit -version 2>&1 | head -1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast: one failing crate used to hide every crate after it
      # (and the e2e step) for a whole day. Every caudal integration test
      # file runs with CAUDAL_E2E=1 (e2e, reload, admin_cli), not just e2e.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest: every test gets a timeout (a hang is killed and named, see
      # .config/nextest.toml), no stopping at the first failing crate, and
      # each test in its own process. Every caudal integration test file runs
      # with CAUDAL_E2E=1 (e2e, reload, admin_cli), not just e2e.
      - name: Tests (all crates, never stop at the first failure)
        timeout-minutes: 40
        env:
          CAUDAL_E2E: "1"
        run: |
          set -o pipefail
          status=0
          cargo nextest run --profile ci --workspace --exclude caudal 2>&1 | tee test.log || status=1
          # The caudal binary's tests drive real servers: one at a time.
          cargo nextest run --profile ci -p caudal --test-threads 1 2>&1 | tee -a test.log || status=1
          cargo test --workspace --doc 2>&1 | tee -a test.log || status=1
          exit $status
      # A test that prints SKIP passed without testing anything. Only the
      # Apple validator is allowed to be missing on Linux (macOS-only tool;
      # the validate-hls job requires it).
      - name: No unexpected SKIPs
        if: always()
        run: |
          grep -oE "SKIP[^\"]*" test.log | sort | uniq -c > skips.txt || true
          { echo "### Skipped tests"; echo '```'; cat skips.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -v "mediastreamvalidator" skips.txt | grep -q .; then
            echo "::error title=Tests skipped::$(grep -v mediastreamvalidator skips.txt | tr '\n' ' ')"
            exit 1
          fi

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  validate-hls:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg
      - name: Is Apple's validator installed?
        id: msv
        run: |
          if command -v mediastreamvalidator >/dev/null; then
            echo "present=1" >> "$GITHUB_OUTPUT"
            echo "mediastreamvalidator: $(command -v mediastreamvalidator)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=LL-HLS conformance NOT VERIFIED::mediastreamvalidator is not installed on this runner (Apple ships it in the HTTP Live Streaming Tools download, behind an Apple ID)."
            echo "### ⚠️ LL-HLS conformance NOT VERIFIED: mediastreamvalidator not installed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: e2e (validator required when present)
        env:
          CAUDAL_E2E: "1"
          CAUDAL_REQUIRE_HLS_VALIDATOR: ${{ steps.msv.outputs.present }}
          CAUDAL_VALIDATION_DIR: ${{ github.workspace }}/hls-validation
        run: cargo test -p caudal --test e2e -- --test-threads=1 --nocapture
      - name: Evidence the validator ran
        if: steps.msv.outputs.present == '1'
        run: |
          ls -l hls-validation
          test -s hls-validation/ll_hls.json
          test -s hls-validation/canary.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.msv.outputs.present == '1'
        with:
          name: hls-validation
          path: hls-validation/

  build-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - run: cargo zigbuild --release -p caudal --target ${{ matrix.target }}
      - run: ls -lh target/${{ matrix.target }}/release/caudal
      - uses: actions/upload-artifact@v4
        with:
          name: caudal-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/caudal

  # Runs on every push/PR (not a nightly cron): the "Test audit" gap this
  # closes ("no fuzzing of network parsers") is exactly the kind of bug a
  # single commit introduces and a human review won't catch (see
  # fuzz/README.md's "Findings so far" for the seven crashes the first
  # couple hours of local fuzzing found, one call chain deeper each time a
  # fix let the target run further). 60s per target is a smoke test, not
  # real fuzzing depth: it exists to catch a broken build, a regression a
  # PR reintroduces, or a target that stops making progress (0 new
  # coverage), not to find new bugs on its own. Real fuzzing time (the
  # `-max_total_time=300`+ runs `fuzz/README.md` documents) is a local,
  # manual thing for now; a longer nightly/scheduled job is future work,
  # left out here to keep this PR's CI change small and easy to verify.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Build every fuzz target
        run: |
          cd fuzz
          for target in $(cargo fuzz list); do
            cargo +nightly fuzz build "$target"
          done
      - name: Run each target for 60s on its saved corpus
        run: |
          cd fuzz
          status=0
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            # cargo-fuzz appends `corpus/$target` (the one committed to this
            # repo) as the last libFuzzer argument automatically.
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=60 -jobs=1 -workers=1 -rss_limit_mb=2048 || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

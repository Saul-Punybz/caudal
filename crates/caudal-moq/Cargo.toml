[package]
name = "caudal-moq"
description = "Media over QUIC (MoQ) output for Caudal, over WebTransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
axum.workspace = true
bytes.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# The moq-dev crates move fast: pinned to exact versions (STATUS.md, Batch 5).
moq-net = "=0.2.22"
hang = "=0.20.13"
moq-mux = "=0.9.16"
moq-native = { version = "=0.19.19", default-features = false, features = ["quinn", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
tempfile = "3"
time = "0.3"

[dev-dependencies]
mp4-atom = "0.15.0"
url = "2"
tower = { version = "0.5", features = ["util"] }

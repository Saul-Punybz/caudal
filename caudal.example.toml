# Validate this file with `caudal check <path>`. Once you've filled it in,
# `caudal doctor [--config <path>]` checks the setup it describes — ports,
# NAT, TLS, clock, tools — and prints what to fix; add `--url http://host:port`
# once a server is running to also flag stream codecs a browser can't play.
# Migrating from MistServer instead of starting from scratch? Skip this file:
# `caudal import-mist <mistserver.conf|config.json>` writes one for you, plus
# a report of what was translated, approximated, or has no Caudal equivalent.

[server]
# HTTP server bind address. Without an [admin] login (below) Caudal refuses
# to listen on anything but loopback; set [admin] before using 0.0.0.0.
http_bind = "127.0.0.1:8080"
# Reverse proxies allowed to set X-Forwarded-For for the resolved client
# address (HLS, WHIP/WHEP, recordings/VOD/clips, the channel skip route;
# RTMP/SRT/RTSP/MoQ always see the raw transport peer, no such header
# exists there). Empty (default): every peer is trusted as the real client.
# trusted_proxies = ["10.0.0.0/8"]

[rtmp]
bind = "0.0.0.0:1935"  # RTMP server bind address
app = "live"  # RTMP application name

[hls]
part_ms = 200  # HLS part duration in milliseconds
segment_ms = 2000  # HLS segment duration in milliseconds
cue_tags = true  # SCTE-35 cues as EXT-X-DATERANGE (SCTE35-OUT/IN/CMD)
cue_out_tags = false  # also legacy EXT-X-CUE-OUT / CUE-OUT-CONT / CUE-IN (many SSAI vendors)
reconnect_grace_secs = 10  # encoder drops and republishes the same name within this: the playlist continues (0 = end at once)

# The live buffer every stream keeps in memory, shared by all its viewers.
# It holds about window_secs x bitrate (a 6 Mbps stream: 0.75 MB per second).
# What it is for: a viewer or recorder that falls behind catches up from it
# instead of skipping ahead, and a recording started while a stream is live
# begins this far back. Players do not need it to join (they start at the
# newest keyframe) and LL-HLS keeps its own segments.
# Default 15 s: covers the LL-HLS playlist (6 segments of 2 s plus the open
# one), about what MediaMTX keeps (7 segments). MistServer's default was 50 s,
# which cost 26 MB more per 6 Mbps stream. Raise it for a DVR window or a
# longer recording pre-roll (`caudal import-mist` sets it from Mist's DVR).
[buffer]
window_secs = 15  # Buffer window duration in seconds
max_mb = 256  # Maximum buffer size in megabytes, whatever the window says

# HTTPS next to HTTP, speaking HTTP/1.1 and HTTP/2. Needed for low-latency
# HLS on Safari and for Apple's conformance. Uncomment one certificate source.
# [tls]
# bind = "0.0.0.0:8443"
# cert = "/etc/caudal/fullchain.pem"   # PEM files, reloaded when they change
# key = "/etc/caudal/privkey.pem"
# acme_domains = ["live.example.com"]  # or: automatic Let's Encrypt
# acme_email = "ops@example.com"
# acme_cache_dir = "/var/lib/caudal/acme"
# acme_staging = false

# Tokens (JWT) to publish and play. Without keys, anyone who can reach the
# server can publish and play. Publish: rtmp://host/live/<name>?token=...,
# srt://host:9000?streamid=publish/<name>?token=...; play: ?token=... or
# "Authorization: Bearer ...". Claims: sub = stream or "prefix*", act =
# "publish" / "play" (or both), exp.
# [auth]
# secret = "at-least-32-characters-of-random-secret"  # HS256, or:
# jwks_url = "https://auth.example.com/.well-known/jwks.json"
# jwks_refresh_secs = 300
# publish = true
# play = false

# Signed webhooks (standardwebhooks.com) on stream.started / stream.ended.
# [hooks]
# urls = ["https://example.com/caudal-events"]
# secret = "whsec_..."

# Recording to disk (and optionally object storage), VOD and clips.
# Recordings: <dir>/<stream>/<YYYYMMDDTHHMMSSZ>/, played at /vod/<stream>/<id>/index.m3u8.
# Clips: POST /api/v1/clips {"stream","id","from_ms","to_ms"} -> MP4.
# [record]
# enabled = true
# dir = "recordings"
# streams = ["*"]            # names or "prefix*"; these record always
# segment_secs = 4
# retention_hours = 168      # delete ended recordings after 7 days
# upload_url = "s3://bucket/caudal"   # credentials from AWS_* env vars

# Recording schedules: start/stop a recording by time instead of recording
# every stream in full. A stream matched by `streams` above always records;
# a schedule only applies to a stream that isn't. Each rule is either a
# one-off `start` (RFC 3339) or a recurring `cron` (5-field crontab: min
# hour dom month dow) evaluated in `tz` (IANA name, default UTC) - not both.
# A window that starts before the stream goes live starts recording as soon
# as it does; a window that ends closes the recording cleanly (VOD ENDLIST).
# Next/current windows: GET /api/v1/record/schedules (no token: operational
# metadata, not stream content).
# [[record.schedule]]
# streams = ["studio"]
# cron = "0 18 * * MON-FRI"   # weekdays at 18:00
# tz = "America/Puerto_Rico"
# duration_secs = 3600        # 1 hour; seconds, not minutes, so short clips
#                              # (and fast tests) don't need a minimum of 60 s
#
# [[record.schedule]]
# streams = ["townhall"]
# start = "2026-09-20T18:00:00-04:00"
# duration_secs = 5400        # 90 minutes

# Send streams out over SRT (pull: srt://host:9000?streamid=play/<name>).
# [[srt.push]]
# stream = "main"
# url = "srt://remote.example:9000?streamid=publish/main&passphrase=..."

# Serve streams out over RTSP (rtsp://host:8554/<name>), TCP interleaved or
# UDP unicast (ffplay/VLC's default), chosen per SETUP by the client. RTSPS
# (TLS, media still interleaved over the same TCP connection) is optional
# and needs its own bind + certificate.
# [rtsp]
# bind = "0.0.0.0:8554"
# udp_port_range = [8000, 8999]  # RTP/RTCP port pairs for UDP unicast SETUPs
# tls_bind = "0.0.0.0:322"       # rtsps://; omit to disable
# tls_cert = "/etc/caudal/fullchain.pem"
# tls_key = "/etc/caudal/privkey.pem"

# Pull an IP camera in as a live stream.
# [[rtsp.pull]]
# stream = "cam1"
# url = "rtsp://user:pass@192.0.2.10/stream1"

# 24/7 channels from files: each playlist plays as one continuous live stream,
# available on every output (LL-HLS, WHEP, MoQ, SRT, RTSP, recording).
# Items are files (MP4/MOV, MPEG-TS) or directories (their media files, sorted
# by name). All files of a channel must share codec parameters; a file that
# differs is skipped and reported in GET /api/v1/channels.
# POST /api/v1/channels/{name}/skip jumps to the next item.
# [[channel]]
# name = "tv"
# items = ["/media/intro.mp4", "/media/shows"]
# loop = true      # default true; false ends the stream after the last item
# shuffle = false  # default false; reshuffles on every pass

# Backup sources: viewers play `stream`, fed by the first healthy entry of
# `sources` (priority order). A source is an ingest stream name (any protocol:
# RTMP, SRT, WHIP, an [[rtsp.pull]]) or `file:<path>`, a file looped by the
# channel player (it runs only while on air, as stream `failover.<stream>.<n>`).
# The active source sending no frames for `switch_after_ms` hands over to the
# next healthy one on its newest keyframe; a better-ranked source healthy for
# `switch_back_after_secs` takes back over. Timestamps continue across every
# switch, so players never restart; a source with different codec parameters
# starts a new EXT-X-MAP after an EXT-X-DISCONTINUITY in LL-HLS.
# GET /api/v1/failover shows the active source, per-source health and the
# last switches. POST /api/v1/failover/{stream}/switch {"source": "main-backup"}
# switches now and prefers that source until {"source": null} (automatic).
# With [health] webhooks, every switch also sends a `failover_switched` event.
# Hot-reloadable; `stream` must not also be a [[channel]].
# [[failover]]
# stream = "main"
# sources = ["main-primary", "main-backup", "file:/media/slate.mp4"]
# switch_after_ms = 2000        # default 2000
# switch_back_after_secs = 10   # default 10

# Multistreaming: push a stream to one or more RTMP/RTMPS ingests while it is
# live, reconnecting with backoff. The stream key is never logged and shows as
# **** in GET /api/v1/restreams. H.264 and AAC; H.265, AV1 and Opus as Enhanced RTMP.
# [[restream]]
# stream = "main"
# url = "rtmps://a.rtmp.youtube.com/live2/xxxx-xxxx-xxxx-xxxx"
# [[restream]]
# stream = "main"
# url = "rtmp://live.twitch.tv/app/live_xxxxxxxx"

# IP multicast: send a stream to a multicast group while it is live, so on a
# cable/IPTV, campus or hotel network one copy leaves the server and the
# switches replicate it. MPEG-TS, 7 x 188-byte packets per UDP datagram, paced
# to the stream's own clock. Needs a network that carries multicast (IGMP
# snooping on the switches); it does not cross the internet. See
# docs/MULTICAST.md. Hot-reloadable; counters in GET /api/v1/multicast and
# /metrics. Receivers: `ffplay udp://239.1.1.1:5000`, VLC `udp://@239.1.1.1:5000`
# (`rtp://@...` for format = "rtp"), set-top boxes.
# [[multicast]]
# stream = "main"
# group = "239.1.1.1:5000"      # IPv6: "[ff15::1]:5000"
# format = "ts"                 # "ts" (raw UDP, default) or "rtp" (RFC 2250, PT 33)
# ttl = 16                      # default 16; 1 keeps it on the local subnet
# interface = "10.0.0.5"        # this host's address on the video network
#                               # (IPv6: the interface index); default: the OS route
# loopback = false              # also deliver to receivers on this host
# pacing = true                 # default true: switches drop bursts

# Admin login for the web UI and every /api/v1 route (not for players and
# encoders: /hls, /play, /vod, /whip, /whep and /moq keep their own [auth]
# tokens). Without [admin], the HTTP listeners must be on loopback.
# Hash a password: printf '%s\n' 'my passphrase' | caudal hash-password
# [admin]
# session_ttl_secs = 43200       # 12 h, absolute
# public_metrics = false         # true: /metrics without a token
# secure_cookies = false         # true behind a TLS-terminating proxy
# allow_unauthenticated = false  # true: run open on a public address anyway
# [[admin.users]]
# name = "ana"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# API tokens for scripts and Prometheus (Authorization: Bearer <token>);
# store only the SHA-256: printf %s "$TOKEN" | shasum -a 256
# [[admin.api_tokens]]
# name = "prometheus"
# token_sha256 = "<64 hex characters>"
# Single sign-on (OpenID Connect, authorization code + PKCE):
# [admin.oidc]
# issuer = "https://accounts.google.com"
# client_id = "..."
# client_secret = "..."
# redirect_url = "https://caudal.example.com/api/v1/auth/oidc/callback"
# allowed_emails = ["ana@example.com"]   # needs email_verified in the ID token
# allowed_groups = []                    # matched against the `groups` claim
# scopes = []                            # extra scopes, e.g. ["groups"]

# WebRTC: WHIP ingest and WHEP playback, every peer on one UDP port.
# [webrtc]
# udp_bind = "0.0.0.0:8189"
# public_ips = []        # addresses to advertise behind a 1:1 NAT
# threads = 0            # peer engines doing SRTP; 0 = one per core, at most 8

# Media over QUIC: output over WebTransport (on by default, self-signed cert
# unless cert/key are set) and ingest. An encoder publishes a `hang`
# broadcast (H.264/H.265 + AAC/Opus, avcC/hvcC or AudioSpecificConfig/
# OpusHead in the catalog) to wss://host:4443/publish/<name>?jwt=<token>
# (a publish-scoped [auth] token, same rules as every other ingest
# protocol); Caudal converts it into a normal stream, so every output (LL-
# HLS, WHEP, RTMP restream, recording, MoQ playback...) carries it exactly
# like an RTMP or WHIP publish. Verify with any `hang`/`moq-mux`-based
# publisher for the pinned moq-net draft (see REUSE.md); moq-clock/moq-cli
# style tools are for the moq-lite predecessor and don't apply here.
# [moq]
# enabled = true
# bind = "0.0.0.0:4443"
# cert = "/etc/caudal/fullchain.pem"  # omit both for a rotating self-signed cert
# key = "/etc/caudal/privkey.pem"
# hosts = []             # self-signed cert hostnames; default ["localhost", "127.0.0.1"]

# Geo-blocking / IP allow-lists per stream, enforced on every protocol
# (RTMP, SRT, RTSP, WHIP/WHEP, HLS/VOD; MoQ only for country/token rules —
# moq-native doesn't expose the peer address). "[[access]]" alone can't
# coexist with "[access] geoip_db" in TOML (the key "access" can't be both
# a table and an array of tables), so rules nest as [[access.rules]], same
# as [[admin.users]] / [[health.stream]] / [[transcode.ladder]] above.
#
# [access]
# geoip_db = "/etc/caudal/GeoLite2-Country.mmdb"  # MaxMind DB / DB-IP; required by any "country:" entry below, never bundled
#
# The first [[access.rules]] entry whose `streams` glob matches a stream
# decides both play and publish for it; later entries are not consulted.
# Within one entry: a deny match always wins over an allow match; an empty
# allow list is not a whitelist (only the deny list applies); a non-empty
# allow list *is* a whitelist (an address matching neither list is denied).
# Entries are CIDRs (a bare address is a /32 or /128 host route) or
# "country:XX" (ISO 3166-1 alpha-2).
# [[access.rules]]
# streams = ["live-*"]
# play_deny = ["203.0.113.0/24", "country:KP"]
# publish_allow = ["10.0.0.0/8"]   # only this network may publish live-*

# Automatic live captions: speech-to-text on this machine (Whisper on the
# pure-Rust `candle` engine; Metal on macOS, CPU elsewhere; no cloud
# service). LL-HLS viewers get a WebVTT subtitle rendition ("Español
# (auto)" / "English (auto)") a few seconds behind the audio. Off unless a
# [[captions.stream]] entry names a stream. AAC or Opus audio.
# The model is downloaded once by the operator, never bundled (Whisper
# weights: MIT, OpenAI), checksum-verified:
#   caudal captions fetch-model base --dir /var/lib/caudal/models
# Measured on an Apple M4, 4 threads (docs/research/CAPTIONS.md): real-time
# factor (inference time / audio time) tiny 0.04 Metal / 0.12 CPU, base
# 0.08 / 0.24, small 0.22 / 0.80. One captioned stream costs about RTF x
# `threads` cores; `threads` is a hard cap for all streams together. On a
# slower machine chunks queued while inference runs are transcribed together
# (up to 30 s per run) rather than dropped. /metrics:
# caudal_captions_real_time_factor (all audio so far; above 1 = falling
# behind), caudal_captions_last_real_time_factor, and
# caudal_captions_inferences_total vs caudal_captions_chunks_total.
# [captions]
# model_dir = "models"      # holds whisper-<model>/ (config.json, tokenizer.json, model.safetensors)
# model = "base"            # tiny (~150 MB), base (~290 MB) or small (~970 MB, best Spanish)
# threads = 2               # inference threads, all streams together (1-64)
# device = "cpu"            # cpu | metal | auto (GPU is opt-in: a driver abort would stop the server)
# max_streams = 2           # streams captioned at once; later ones get none
# [[captions.stream]]
# streams = ["noticias*"]   # names or prefix* globs; renditions (name+label) share the source's captions
# language = "es"           # es | en | auto (detected per chunk) | any code the model knows (pt, fr, ...)
#                           # Verified: Spanish and English only; other languages work but their
#                           # quality is unmeasured (docs/research/CAPTIONS.md, "Languages").

# Origin-edge clustering (docs/research/CLUSTER.md). Publishers push to any
# origin; viewers connect to any edge. An edge pulls a stream over MoQ from
# the first origin that has it when its first viewer asks (LL-HLS, WHEP,
# RTSP or SRT play), shares that one pull between all its viewers, stops it
# idle_timeout_secs after the last viewer leaves, and moves to the next
# origin without restarting its viewers when the current one goes away.
# Origins need [moq] enabled. Every node uses the same `secret`; a node's
# token plays any stream on an origin, past [auth] and [[access.rules]]
# (the edge applies its own to its viewers). Absent: a standalone server.
#
# [cluster]
# role = "origin"
# node_id = "origin-a"                     # logs and tokens; default "caudal"
# secret = "change-me-shared-cluster-secret" # >= 16 bytes, same on every node
#
# [cluster]
# role = "edge"
# node_id = "edge-1"
# secret = "change-me-shared-cluster-secret"
# origins = ["http://origin-a:8080", "http://origin-b:8080"]  # HTTP base URLs, tried in order
# idle_timeout_secs = 30                   # stop pulling this long after the last viewer
# source_timeout_secs = 10                 # end the stream when no origin has it this long

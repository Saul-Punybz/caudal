# Generated by `caudal import-mist` from a MistServer config. Validated against
# Caudal's own rules already (same checks as `caudal check`); read the import
# report printed alongside this file for what was approximated or dropped.
# `caudal doctor --config <this file>` checks the setup it describes next.

[srt]
bind = "0.0.0.0:9000"

[rtsp]
bind = "0.0.0.0:8554"

[[rtsp.pull]]
stream = "cam1"
url = "rtsp://user:pass@192.0.2.10/stream1"

[webrtc]
udp_bind = "0.0.0.0:8189"

[[channel]]
name = "tv"
items = ["/media/intro.mp4"]

[[channel]]
name = "vod-library"
items = ["/media/shows"]

# Admin login: without it, Caudal refuses to listen on anything but loopback.
# Hash each MistServer user's new password: printf '%s\n' 'pass' | caudal hash-password
# [admin]
# session_ttl_secs = 43200
# [[admin.users]]
# name = "ana"
# password_hash = "$argon2id$..."

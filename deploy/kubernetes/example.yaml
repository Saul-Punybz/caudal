---
# Source: caudal/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caudal
  labels:
    helm.sh/chart: caudal-0.1.0
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caudal
      app.kubernetes.io/instance: caudal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caudal
        app.kubernetes.io/instance: caudal
    spec:
      serviceAccountName: caudal
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # The image is `FROM scratch`: no shell, so the ConfigMap and the
      # admin password hash (kept in separate resources — see
      # templates/configmap.yaml and templates/secret-admin.yaml) are
      # merged into the one file `caudal --config` reads by a small
      # busybox initContainer, into a shared emptyDir.
      initContainers:
        - name: merge-config
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /config/caudal.toml /work/caudal.toml
              hash="$(cat /admin-secret/password-hash)"
              {
                echo ""
                echo "[[admin.users]]"
                echo "name = \"admin\""
                printf 'password_hash = "%s"\n' "$hash"
              } >> /work/caudal.toml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: admin-secret
              mountPath: /admin-secret
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: caudal
          image: ghcr.io/saul-punybz/caudal:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--config", "/work/caudal.toml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: webrtc
              containerPort: 8189
              protocol: UDP
            - name: srt
              containerPort: 9000
              protocol: UDP
            - name: moq
              containerPort: 4443
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: work
              mountPath: /work
              readOnly: true
            - name: recordings
              mountPath: /data/recordings
      volumes:
        - name: config
          configMap:
            name: caudal
        - name: work
          emptyDir: {}
        - name: admin-secret
          secret:
            secretName: caudal-admin
        - name: recordings
          persistentVolumeClaim:
            claimName: caudal-recordings

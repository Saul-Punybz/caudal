# Validate this file with `caudal check <path>`. Once you've filled it in,
# `caudal doctor [--config <path>]` checks the setup it describes — ports,
# NAT, TLS, clock, tools — and prints what to fix; add `--url http://host:port`
# once a server is running to also flag stream codecs a browser can't play.

[server]
# HTTP server bind address. Without an [admin] login (below) Caudal refuses
# to listen on anything but loopback; set [admin] before using 0.0.0.0.
http_bind = "127.0.0.1:8080"
# Reverse proxies allowed to set X-Forwarded-For for the resolved client
# address (HLS, WHIP/WHEP, recordings/VOD/clips, the channel skip route;
# RTMP/SRT/RTSP/MoQ always see the raw transport peer, no such header
# exists there). Empty (default): every peer is trusted as the real client.
# trusted_proxies = ["10.0.0.0/8"]

[rtmp]
bind = "0.0.0.0:1935"  # RTMP server bind address
app = "live"  # RTMP application name

[hls]
part_ms = 200  # HLS part duration in milliseconds
segment_ms = 2000  # HLS segment duration in milliseconds
cue_tags = true  # SCTE-35 cues as EXT-X-DATERANGE (SCTE35-OUT/IN/CMD)
cue_out_tags = false  # also legacy EXT-X-CUE-OUT / CUE-OUT-CONT / CUE-IN (many SSAI vendors)
reconnect_grace_secs = 10  # encoder drops and republishes the same name within this: the playlist continues (0 = end at once)

[buffer]
window_secs = 50  # Buffer window duration in seconds
max_mb = 256  # Maximum buffer size in megabytes

# HTTPS next to HTTP, speaking HTTP/1.1 and HTTP/2. Needed for low-latency
# HLS on Safari and for Apple's conformance. Uncomment one certificate source.
# [tls]
# bind = "0.0.0.0:8443"
# cert = "/etc/caudal/fullchain.pem"   # PEM files, reloaded when they change
# key = "/etc/caudal/privkey.pem"
# acme_domains = ["live.example.com"]  # or: automatic Let's Encrypt
# acme_email = "ops@example.com"
# acme_cache_dir = "/var/lib/caudal/acme"
# acme_staging = false

# Tokens (JWT) to publish and play. Without keys, anyone who can reach the
# server can publish and play. Publish: rtmp://host/live/<name>?token=...,
# srt://host:9000?streamid=publish/<name>?token=...; play: ?token=... or
# "Authorization: Bearer ...". Claims: sub = stream or "prefix*", act =
# "publish" / "play" (or both), exp.
# [auth]
# secret = "at-least-32-characters-of-random-secret"  # HS256, or:
# jwks_url = "https://auth.example.com/.well-known/jwks.json"
# jwks_refresh_secs = 300
# publish = true
# play = false

# Signed webhooks (standardwebhooks.com) on stream.started / stream.ended.
# [hooks]
# urls = ["https://example.com/caudal-events"]
# secret = "whsec_..."

# Recording to disk (and optionally object storage), VOD and clips.
# Recordings: <dir>/<stream>/<YYYYMMDDTHHMMSSZ>/, played at /vod/<stream>/<id>/index.m3u8.
# Clips: POST /api/v1/clips {"stream","id","from_ms","to_ms"} -> MP4.
# [record]
# enabled = true
# dir = "recordings"
# streams = ["*"]            # names or "prefix*"
# segment_secs = 4
# retention_hours = 168      # delete ended recordings after 7 days
# upload_url = "s3://bucket/caudal"   # credentials from AWS_* env vars

# Send streams out over SRT (pull: srt://host:9000?streamid=play/<name>).
# [[srt.push]]
# stream = "main"
# url = "srt://remote.example:9000?streamid=publish/main&passphrase=..."

# Serve streams out over RTSP (rtsp://host:8554/<name>), TCP interleaved or
# UDP unicast (ffplay/VLC's default), chosen per SETUP by the client. RTSPS
# (TLS, media still interleaved over the same TCP connection) is optional
# and needs its own bind + certificate.
# [rtsp]
# bind = "0.0.0.0:8554"
# udp_port_range = [8000, 8999]  # RTP/RTCP port pairs for UDP unicast SETUPs
# tls_bind = "0.0.0.0:322"       # rtsps://; omit to disable
# tls_cert = "/etc/caudal/fullchain.pem"
# tls_key = "/etc/caudal/privkey.pem"

# Pull an IP camera in as a live stream.
# [[rtsp.pull]]
# stream = "cam1"
# url = "rtsp://user:pass@192.0.2.10/stream1"

# 24/7 channels from files: each playlist plays as one continuous live stream,
# available on every output (LL-HLS, WHEP, MoQ, SRT, RTSP, recording).
# Items are files (MP4/MOV, MPEG-TS) or directories (their media files, sorted
# by name). All files of a channel must share codec parameters; a file that
# differs is skipped and reported in GET /api/v1/channels.
# POST /api/v1/channels/{name}/skip jumps to the next item.
# [[channel]]
# name = "tv"
# items = ["/media/intro.mp4", "/media/shows"]
# loop = true      # default true; false ends the stream after the last item
# shuffle = false  # default false; reshuffles on every pass

# Multistreaming: push a stream to one or more RTMP/RTMPS ingests while it is
# live, reconnecting with backoff. The stream key is never logged and shows as
# **** in GET /api/v1/restreams. H.264 and AAC; H.265, AV1 and Opus as Enhanced RTMP.
# [[restream]]
# stream = "main"
# url = "rtmps://a.rtmp.youtube.com/live2/xxxx-xxxx-xxxx-xxxx"
# [[restream]]
# stream = "main"
# url = "rtmp://live.twitch.tv/app/live_xxxxxxxx"

# Admin login for the web UI and every /api/v1 route (not for players and
# encoders: /hls, /play, /vod, /whip, /whep and /moq keep their own [auth]
# tokens). Without [admin], the HTTP listeners must be on loopback.
# Hash a password: printf '%s\n' 'my passphrase' | caudal hash-password
# [admin]
# session_ttl_secs = 43200       # 12 h, absolute
# public_metrics = false         # true: /metrics without a token
# secure_cookies = false         # true behind a TLS-terminating proxy
# allow_unauthenticated = false  # true: run open on a public address anyway
# [[admin.users]]
# name = "ana"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# API tokens for scripts and Prometheus (Authorization: Bearer <token>);
# store only the SHA-256: printf %s "$TOKEN" | shasum -a 256
# [[admin.api_tokens]]
# name = "prometheus"
# token_sha256 = "<64 hex characters>"
# Single sign-on (OpenID Connect, authorization code + PKCE):
# [admin.oidc]
# issuer = "https://accounts.google.com"
# client_id = "..."
# client_secret = "..."
# redirect_url = "https://caudal.example.com/api/v1/auth/oidc/callback"
# allowed_emails = ["ana@example.com"]   # needs email_verified in the ID token
# allowed_groups = []                    # matched against the `groups` claim
# scopes = []                            # extra scopes, e.g. ["groups"]

# WebRTC: WHIP ingest and WHEP playback, every peer on one UDP port.
# [webrtc]
# udp_bind = "0.0.0.0:8189"
# public_ips = []        # addresses to advertise behind a 1:1 NAT
# threads = 0            # peer engines doing SRTP; 0 = one per core, at most 8

# Geo-blocking / IP allow-lists per stream, enforced on every protocol
# (RTMP, SRT, RTSP, WHIP/WHEP, HLS/VOD; MoQ only for country/token rules —
# moq-native doesn't expose the peer address). "[[access]]" alone can't
# coexist with "[access] geoip_db" in TOML (the key "access" can't be both
# a table and an array of tables), so rules nest as [[access.rules]], same
# as [[admin.users]] / [[health.stream]] / [[transcode.ladder]] above.
#
# [access]
# geoip_db = "/etc/caudal/GeoLite2-Country.mmdb"  # MaxMind DB / DB-IP; required by any "country:" entry below, never bundled
#
# The first [[access.rules]] entry whose `streams` glob matches a stream
# decides both play and publish for it; later entries are not consulted.
# Within one entry: a deny match always wins over an allow match; an empty
# allow list is not a whitelist (only the deny list applies); a non-empty
# allow list *is* a whitelist (an address matching neither list is denied).
# Entries are CIDRs (a bare address is a /32 or /128 host route) or
# "country:XX" (ISO 3166-1 alpha-2).
# [[access.rules]]
# streams = ["live-*"]
# play_deny = ["203.0.113.0/24", "country:KP"]
# publish_allow = ["10.0.0.0/8"]   # only this network may publish live-*

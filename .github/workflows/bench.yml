name: Benchmark (Linux)

# Heavy benchmarks run here, on GitHub's Linux runners, instead of on a
# developer laptop (19 Sep 2026: the M4 overheated running them next to
# builds). Shared runners are noisy: compare Caudal and MediaMTX within the
# same run, not absolute numbers across runs.
on:
  workflow_dispatch:
    inputs:
      protos:
        description: "Protocols (hls,rtsp,whep)"
        default: "whep"
      levels:
        description: "Viewer levels"
        default: "100,300"
      reps:
        description: "Repetitions per cell"
        default: "3"
      only:
        description: "Scenarios (idle,fanout,latency)"
        default: "fanout"
      servers:
        description: "Servers"
        default: "caudal,mediamtx"

env:
  MISTSERVER_VERSION: "3.11.2"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            bench/client
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          nproc; free -g; uname -a
      - name: Tools for MistServer
        if: contains(inputs.servers, 'mistserver')
        run: |
          # Meson/Ninja build MistServer from source (bench/fetch-mistserver.sh).
          # Deliberately NOT installing libmbedtls-dev/libsrtp2-dev: Ubuntu
          # 24.04 ships mbedtls 2.28, and MistServer 3.11.2 needs the mbedtls
          # 3.6.6 API (pinned in subprojects/mbedtls.wrap) -- linking against
          # the system's 2.28 headers compiled ('ssl_conf' was not declared
          # in this scope in lib/socket.cpp; see git log). Leaving both dev
          # packages uninstalled makes Meson build its own pinned mbedtls and
          # libsrtp2 from source (subprojects/*.wrap) every time, which is
          # slower but guaranteed API-compatible; the build is cached below.
          sudo apt-get install -y meson ninja-build pkg-config
          pkg-config --version
      - name: Cache MistServer build
        if: contains(inputs.servers, 'mistserver')
        uses: actions/cache@v4
        with:
          path: bench/.cache/mistserver-${{ env.MISTSERVER_VERSION }}
          key: mistserver-${{ runner.os }}-${{ env.MISTSERVER_VERSION }}-${{ hashFiles('bench/fetch-mistserver.sh', 'bench/mistserver.json') }}
      - name: Run
        run: |
          set -o pipefail   # `| tee` must not hide a failed run
          ulimit -n 65536 || true
          bench/run.sh --reps "${{ inputs.reps }}" --only "${{ inputs.only }}" \
            --protos "${{ inputs.protos }}" --levels "${{ inputs.levels }}" \
            --servers "${{ inputs.servers }}" | tee bench-out.md
          cat bench-out.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: |
            bench/results/
            bench-out.md

[package]
name = "caudal-webrtc"
description = "WebRTC for Caudal: WHIP ingest, WHEP playback and WHIP push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caudal-core.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
scuffle-h264 = "0.2.2"
bytes.workspace = true
mp4-atom = "0.15"
if-addrs = "0.15"
getrandom = "0.3"
socket2 = "0.6"
parking_lot.workspace = true
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quinn-udp = { version = "0.5.15", default-features = false, features = ["tracing"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util", "process"] }
ureq = { version = "3", default-features = false }

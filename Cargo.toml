[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"  # scte35-splice (caudal-scte35) requires 1.95
license = "MIT OR Apache-2.0"
repository = "https://github.com/Saul-Punybz/caudal"

[workspace.dependencies]
bytes = "1"
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caudal-core = { path = "crates/caudal-core", version = "0.1.0" }
caudal-rtmp = { path = "crates/caudal-rtmp", version = "0.1.0" }
caudal-hls = { path = "crates/caudal-hls", version = "0.1.0" }
caudal-srt = { path = "crates/caudal-srt", version = "0.1.0" }
caudal-ui = { path = "crates/caudal-ui", version = "0.1.0" }
caudal-tls = { path = "crates/caudal-tls", version = "0.1.0" }
caudal-auth = { path = "crates/caudal-auth", version = "0.1.0" }
caudal-webrtc = { path = "crates/caudal-webrtc", version = "0.1.0" }
caudal-moq = { path = "crates/caudal-moq", version = "0.1.0" }
caudal-cmaf = { path = "crates/caudal-cmaf", version = "0.1.0" }
caudal-record = { path = "crates/caudal-record", version = "0.1.0" }
caudal-ts = { path = "crates/caudal-ts", version = "0.1.0" }
caudal-rtsp = { path = "crates/caudal-rtsp", version = "0.1.0" }
caudal-transcode = { path = "crates/caudal-transcode", version = "0.1.0" }
caudal-channel = { path = "crates/caudal-channel", version = "0.1.0" }
caudal-restream = { path = "crates/caudal-restream", version = "0.1.0" }
caudal-scte35 = { path = "crates/caudal-scte35", version = "0.1.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# scuffle-rtmp 0.2.3 (latest) froze timestamps on Type 3 chunks that start a
# new message. Patched copy with a regression test; see vendor/README.md.
[patch.crates-io]
scuffle-rtmp = { path = "vendor/scuffle-rtmp" }

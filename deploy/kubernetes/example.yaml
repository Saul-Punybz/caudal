---
# Source: caudal/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: caudal
  labels:
    helm.sh/chart: caudal-0.1.0
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: caudal
    app.kubernetes.io/instance: caudal
  ports:
